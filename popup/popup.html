<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; }
  .header { background: linear-gradient(135deg, #0f172a, #1e3a5f); padding: 16px; text-align: center; }
  .header img { height: 20px; margin-bottom: 6px; }
  .header h1 { color: white; font-size: 14px; font-weight: 700; }
  .header p { color: rgba(255,255,255,0.5); font-size: 10px; }

  .score-section { padding: 20px; text-align: center; }
  .no-score { padding: 30px 20px; text-align: center; color: #64748b; }
  .no-score .icon { font-size: 32px; margin-bottom: 8px; }
  .no-score p { font-size: 12px; line-height: 1.5; }

  .score-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .score-circle .num { font-size: 28px; font-weight: 800; }
  .score-circle .out-of { font-size: 10px; opacity: 0.7; }
  .system-name { font-size: 16px; font-weight: 700; color: #0f172a; }
  .tier-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; margin-top: 4px; }

  .findings { padding: 0 20px 16px; }
  .findings h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; margin-bottom: 6px; }
  .finding { font-size: 11px; padding: 4px 0; color: #475569; border-bottom: 1px solid #f1f5f9; }
  .finding.risk { color: #c2410c; }
  .finding.positive { color: #15803d; }

  .cta { padding: 16px 20px; border-top: 1px solid #f1f5f9; }
  .cta-low { background: #fef3c7; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; }
  .cta-low p { font-size: 11px; color: #92400e; line-height: 1.4; }
  .cta-low a { color: #d97706; font-weight: 700; text-decoration: none; }

  .links { display: flex; gap: 8px; }
  .links a { flex: 1; display: block; text-align: center; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 600; text-decoration: none; }
  .links .primary { background: #0891b2; color: white; }
  .links .secondary { background: #f1f5f9; color: #475569; }

  .footer { padding: 12px 20px; text-align: center; border-top: 1px solid #f1f5f9; }
  .footer a { font-size: 10px; color: #0891b2; text-decoration: none; }

  .prelim-badge { display: inline-block; margin-left: 6px; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; background: #e2e8f0; color: #475569; vertical-align: middle; }
  .disclaimer { margin: 0 20px 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 10px; color: #64748b; line-height: 1.45; }
  .disclaimer strong { color: #475569; }
  .verify { padding: 12px 20px 4px; border-top: 1px solid #f1f5f9; }
  .verify .vtitle { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #94a3b8; margin-bottom: 8px; }
  .verify a.vbtn, .verify button.vbtn { display: block; width: 100%; text-align: center; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; margin-bottom: 8px; font-family: inherit; }
  .verify .vprimary { background: #0891b2; color: #fff; }
  .verify .vsecondary { background: #fff; color: #0891b2; border: 1.5px solid #0891b2; }
  .verify .vhint { font-size: 10px; color: #94a3b8; text-align: center; margin-bottom: 4px; }
  .verify .vhint a { color: #0891b2; text-decoration: none; font-weight: 600; }

  .shadow { padding: 14px 20px; border-top: 6px solid #f8fafc; }
  .shadow h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .shadow .count { color: #0891b2; font-weight: 800; }
  .sa-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f8fafc; }
  .sa-name { font-size: 12px; font-weight: 600; color: #0f172a; }
  .sa-cat { font-size: 10px; color: #94a3b8; }
  .sa-hits { font-size: 11px; font-weight: 700; color: #0891b2; white-space: nowrap; }
  .sa-empty { font-size: 11px; color: #64748b; line-height: 1.5; }
  .sa-clear { font-size: 10px; color: #94a3b8; text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; }
</style>
</head>
<body>
  <div class="header">
    <h1>TrustModel Safety Check</h1>
    <p>Independent AI Trust Ratings</p>
  </div>

  <div id="content">
    <div class="no-score">
      <div class="icon">🔍</div>
      <p>Loading...</p>
    </div>
  </div>

  <div class="shadow" id="shadow"></div>

  <div class="footer">
    <a href="https://trustmodel.ai/leaderboard" target="_blank">trustmodel.ai/leaderboard — 281 systems scored</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
